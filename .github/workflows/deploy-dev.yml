name: Deploy Dev

# Baut die Seite und lädt NUR das Ergebnis (dist/) auf den Hostinger-Dev-Server.
# Der Quellcode bleibt auf GitHub, auf dem Webspace landet fertiges HTML.
#
# Voraussetzung — diese Secrets müssen im Repo hinterlegt sein
# (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    z. B. ftp.deine-dev-domain.tld
#   FTP_USERNAME  FTP-Benutzer aus dem Hostinger hPanel
#   FTP_PASSWORD  zugehöriges Passwort
#   FTP_DIR       Zielverzeichnis, meist public_html/ (mit Slash am Ende)
#
# Die Werte legt Christian selbst an — sie gehören nicht ins Repo.

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt manuelles Auslösen im Actions-Tab

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bauen
        run: npm run build

      - name: Ergebnis prüfen
        # Bricht ab, bevor ein leeres Verzeichnis hochgeladen wird und
        # die Live-Seite überschreibt.
        run: |
          test -f dist/index.html || { echo "dist/index.html fehlt — Build fehlgeschlagen"; exit 1; }
          echo "Build ok:"; du -sh dist

      - name: Zielverzeichnis normalisieren
        id: ftpdir
        # Die Action verlangt einen Pfad mit Schrägstrich am Ende. Statt sich
        # darauf zu verlassen, dass das Secret korrekt gepflegt ist, ergänzen
        # wir ihn hier — spart eine Fehlerquelle beim Anlegen der Secrets.
        env:
          RAW: ${{ secrets.FTP_DIR }}
        run: |
          DIR="${RAW:-public_html/}"
          case "$DIR" in
            */) ;;
            *) DIR="$DIR/" ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: FTP-Datenkanal diagnostizieren
        # TEMPORAER. Der Upload stirbt beim ersten Verzeichnis-Listing mit
        # ECONNRESET auf dem Datenkanal — in FTP und FTPS gleichermassen.
        # Dieser Schritt zeigt, welche Adresse der Server per PASV fuer den
        # Datenkanal nennt. Ist es eine private IP, liegt es an der
        # Server-Konfiguration; antwortet der Port gar nicht, blockt eine
        # Firewall. Bricht den Lauf nicht ab und wird danach wieder entfernt.
        continue-on-error: true
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "--- Laeuft Port 21 ueberhaupt? ---"
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$S/21" 2>/dev/null; then
            echo "TCP 21: offen"
          else
            echo "TCP 21: nicht erreichbar"
          fi
          echo "--- PASV-Dialog (FTPS explizit) ---"
          # Passwort zusaetzlich selbst maskieren, unabhaengig von GitHubs Maskierung.
          curl -v --ssl-reqd --ftp-pasv --list-only --max-time 45 \
            "ftp://$S/" --user "$U:$P" 2>&1 \
            | sed -e "s/$P/<passwort>/g" | head -n 60 || true

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Verschluesselt uebertragen. Behebt den ECONNRESET auf dem
          # Datenkanal nicht (der tritt in beiden Modi auf), ist aber ohnehin
          # richtig, solange Zugangsdaten ueber die Leitung gehen.
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.ftpdir.outputs.dir }}
          # Nur geänderte Dateien übertragen; der Zustand wird serverseitig
          # in .ftp-deploy-sync-state.json vermerkt.
          dangerous-clean-slate: false
          # Ein leerer Webspace bedeutet Vollupload (~35 MB); die 30 s der
          # Action reichen dafuer nicht.
          timeout: 120000
          # Vorlaeufig ausfuehrlich, damit im Log steht, wo es abbricht.
          log-level: verbose
